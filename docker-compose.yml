services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    ports:
      - "11434:11434"
    volumes:
      - ./ollama/models:/root/.ollama
    restart: unless-stopped
    gpus: all
    cpus: 12
    mem_limit: 12g
    networks:
      - ai

  open-webui:
    image: ghcr.io/open-webui/open-webui:v0.11.0
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui/data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - ai
      
  comfyui:
    image: yanwk/comfyui-boot:cu126-slim
    container_name: comfyui
    ports:
      - "8188:8188"
    volumes:
      - ./comfy/models:/root/ComfyUI/models
      - ./comfy/input:/root/ComfyUI/input
      - ./comfy/output:/root/ComfyUI/output
      - ./comfy/custom_nodes:/root/ComfyUI/custom_nodes
      - ./comfy/user:/root/ComfyUI/user
      - ./comfy/workflows:/root/ComfyUI/user/default/workflows
    environment:
      - CLI_ARGS=--listen 0.0.0.0 --lowvram --cpu-vae
    restart: unless-stopped
    gpus: all
    cpus: 6
    mem_limit: 12g
    networks:
      - ai

  comfy-mcp:
    build:
      context: ./mcp/comfy
    container_name: comfy-mcp
    ports:
      - "8000:8000"
    environment:
      - COMFYUI_HOST=comfyui
      - COMFYUI_PORT=8188
      - WORKFLOW_DIR=/workflows
      - OUTPUT_PREFIX=mcp
    volumes:
      - ./comfy/workflow-api:/workflows:ro
    depends_on:
      - comfyui
    restart: unless-stopped
    networks:
      - ai

  image-planner-mcp:
    build:
      context: ./mcp/image-planner
    container_name: image-planner-mcp
    ports:
      - "8200:8200"
    environment:
      - OLLAMA_URL=http://ollama:11434
      - PLANNER_MODEL=huihui_ai/gemma-4-abliterated:e4b
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - ai

  mcpo:
    image: ghcr.io/open-webui/mcpo:main
    container_name: mcpo
    command:
      - --host
      - 0.0.0.0
      - --port
      - "8001"
      - --config
      - /config/mcp.json
    volumes:
      - ./mcpo/config/mcp.json:/config/mcp.json:ro
    ports:
      - "8001:8001"
    depends_on:
      - comfy-mcp
      - image-planner-mcp
    restart: unless-stopped
    networks:
      - ai

networks:
  ai: